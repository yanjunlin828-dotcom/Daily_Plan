<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:*; style-src 'self'; script-src 'self'; img-src 'self' data:"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Daily Plan · 随身专注</title><link rel="stylesheet" href="panel.css"></head><body><main class="shell">
<header class="header"><div class="brand"><span class="brand-mark"></span>daily<span>plan</span></div><div class="window-actions"><button id="pin-button" class="icon-button" aria-label="固定面板" aria-pressed="false" title="固定面板" data-icon="pin"></button><button id="open-main-button" class="icon-button" aria-label="打开完整页面" title="打开完整页面" data-icon="external"></button><button id="quit-button" class="icon-button" aria-label="退出 Daily Plan" title="退出 Daily Plan" data-icon="power"></button><button id="close-button" class="icon-button" aria-label="收起面板" title="收起面板" data-icon="close"></button></div></header>
<nav class="primary-tabs" aria-label="面板视图"><span class="tab-indicator"></span><button class="primary-tab is-active" data-view="tasks" aria-pressed="true">任务 <span id="panel-task-count">—</span></button><button class="primary-tab" data-view="focus" aria-pressed="false">专注 <span id="panel-timer-mini">00:00</span></button></nav>
<section class="view is-active" data-panel="tasks"><div class="day-heading"><div><div class="eyebrow" id="panel-date">TODAY</div><h1 id="panel-task-summary">安排好这一刻</h1></div><svg class="day-ring" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18"/><circle id="day-progress" cx="22" cy="22" r="18" pathLength="100"/><path d="m16 22 4 4 8-8"/></svg></div>
<div class="scope-tabs"><button class="scope-button is-active" data-scope="today" aria-pressed="true">今日任务</button><button class="scope-button" data-scope="todo" aria-pressed="false">待办清单</button></div>
<form id="add-form" class="add-task"><span data-icon="plus"></span><input id="task-input" aria-label="添加任务" placeholder="下一件想完成的事…" autocomplete="off" maxlength="500"><button type="submit" aria-label="添加任务" title="Enter 添加" data-icon="enter"></button></form><div id="panel-task-list" class="task-list"><div class="empty">正在读取任务…</div></div>
<button id="mini-session" class="mini-session" hidden><span class="live-dot"></span><span id="mini-title">自由专注</span><b id="mini-clock">00:00</b><span data-icon="arrow"></span></button></section>
<section class="view focus-view" data-panel="focus"><div class="focus-heading"><span class="eyebrow" id="focus-status">留一段时间，给一件事</span><h1 id="panel-focus-task">自由专注</h1><button id="choose-task" class="text-button">从任务开始 ↗</button></div>
<div class="dial"><div class="dial-ticks"></div><svg viewBox="0 0 224 224" aria-hidden="true"><circle class="dial-track" cx="112" cy="112" r="94"/><circle id="minute-progress" cx="112" cy="112" r="94" pathLength="60"/></svg><div class="dial-center"><span id="panel-timer-value">00:00</span><span id="dial-caption">准备开始</span></div><span class="dial-origin"></span></div>
<div class="timer-actions"><button id="panel-timer-button" class="primary-button">开始专注</button><button id="finish-button" class="secondary-button" hidden>结束并保存</button></div><div class="focus-stats"><div><span>今日已记录</span><strong id="panel-today-total">0 分钟</strong></div><div><span>已完成专注</span><strong id="session-count">0 次</strong></div></div><button id="discard-button" class="text-button discard" hidden>放弃本次计时</button></section>
<footer><span id="panel-sync"><i></i><span>正在连接</span></span><span>一步一步，完成今天</span></footer><div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="discard-dialog" class="dialog-backdrop" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="discard-title"><span class="eyebrow">本次专注</span><h2 id="discard-title">放弃这段计时？</h2><p>本次时长不会写入每日记录。</p><div><button id="cancel-discard" class="secondary-button">继续保留</button><button id="confirm-discard" class="danger-button">放弃计时</button></div></section></div>
</main><script src="../shared/api.js"></script><script src="clock.js"></script><script src="panel.js"></script></body></html>
